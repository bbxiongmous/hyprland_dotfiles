# #######################################################################################
# HYPRLAND CONFIG (fixed rules for your Hyprland version)
# #######################################################################################

#autogenerated = 1 # remove this line to remove the warning


################
### MONITORS ###
################
monitor=,1920x1080@60,auto,1.0

###################
### MY PROGRAMS ###
###################
$terminal = foot
$fileManager = thunar
$menu = wofi --show drun
$music_player = rmpc


#################
### AUTOSTART ###
#################
exec-once = waybar & hyprpaper & hypridle
exec-once = dunst
exec-once = fcitx5
exec-once = gammastep
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = blueman-applet

#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 1

# original color
#    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
#    col.inactive_border = rgba(595959aa)

# gold
#    col.active_border = rgba(ffd700ff) rgba(d4af37ff) 45deg
#    col.inactive_border = rgba(444444aa)

#silver
#    col.active_border = rgba(eeeeeeff) rgba(9e9e9eff) 45deg
#    col.inactive_border = rgba(3a3a3acc)

# Titanium Gold
    col.active_border = rgba(c2b280ff) rgba(8a7f4cff) 45deg
    col.inactive_border = rgba(3f3f3fcc)

# gunmetal
#  col.active_border = rgba(2a3439ff) rgba(4b5d67ff) 45deg
#  col.inactive_border = rgba(3a3a3acc)

#Bronze
#  col.active_border = rgba(cd7f32ff) rgba(8b5a2bff) 45deg
#  col.inactive_border = rgba(444444cc)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}



decoration {
    rounding = 0
    rounding_power = 2

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

animations {
    # Your original line "enabled = yes, please :)" will error on many newer builds.
    enabled = yes

    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

# Workspace rules (kept)
workspace = w[tv1], gapsout:0, gapsin:0
workspace = 1, gapsout:0, gapsin:0

# Fixed workspace window rules (v2 syntax)
windowrule = match:workspace w[tv1], border_size 0
windowrule = match:workspace w[tv1], rounding 0
windowrule = match:workspace 1, border_size 1
windowrule = match:workspace 1, rounding 0


########################
### LAYOUTS ###
########################
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = false
}


#############
### INPUT ###
#############
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################
$mainMod = SUPER

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
#bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Added by Victor
bind = , PRINT, exec, hyprshot -m region
bind = SHIFT, PRINT, exec, hyprshot -m window
bind = CTRL, PRINT, exec, hyprshot -m output
bind = $mainMod, W, exec, flatpak run com.google.Chrome
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, T, exec, flatpak run com.tencent.WeChat
bind = $mainMod, O, exec, obsidian
bind = $mainMod, U, exec, foot --title rmpc --app-id=tui-app -e $music_player
#bind = $mainMod, B, exec, foot --title tui-app --class tui-app -e bluetui


bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Restore your pre-upgrade behavior: ignore maximize requests from apps
windowrule = match:class .*, suppress_event maximize

# TUIs (foot --class tui-app): float + size + center
#windowrulev2 = float, class:^(tui-app)$
## (merged into rule below)
#windowrulev2 = center, class:^(tui-app)$
# TUIs launched via shortcuts: float + size + center (match by title)
# (merged into rule below)
# (merged into rule below)
windowrule = match:class ^(tui-app)$, float on, size 1200 750, center on


# Fix some dragging issues with XWayland (optional, keep commented if you want)
#windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
# Fix dragging issues with XWayland (modern syntax)
windowrule = match:xwayland 1, match:class ^$, match:title ^$, no_initial_focus on
windowrule = match:xwayland 1, match:class ^$, match:title ^$, float on

